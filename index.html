      body {
        background-color: #0f0f0f;
        color: #dce5d7;
      }
      .glow-primary {
        box-shadow: 0 0 12px 0 rgba(0, 200, 83, 0.2);
      }
      .glow-true {
        box-shadow: 0 0 12px 2px rgba(0, 200, 83, 0.2);
      }
      .glow-false {
        box-shadow: 0 0 12px 2px rgba(255, 180, 171, 0.2);
      }
      .glow-warning {
        box-shadow: 0 0 12px 2px rgba(255, 218, 214, 0.2);
      }
      .glow-status-true {
        box-shadow: 0 0 12px 2px rgba(63, 229, 108, 0.2);
      }
      .glow-fake {
        box-shadow: 0 0 12px 2px rgba(255, 23, 68, 0.2);
      }

        background-color: #1a1a1a;
      }
      .bg-level-2 {

        background-color: rgba(0, 200, 83, 0.1);

      }
      .badge-false {
        background-color: rgba(255, 180, 171, 0.1);
        color: #ffb4ab;
      }
      .badge-warning {
        background-color: rgba(255, 218, 214, 0.1);
        color: #ffb7ae;
      }
